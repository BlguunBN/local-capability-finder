name: Published package smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-package:
    name: npm registry (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional YAML dependency
        run: python -m pip install PyYAML
      - name: Install published npm version and exercise MCP wire
        run: python tests/smoke_package.py --published
