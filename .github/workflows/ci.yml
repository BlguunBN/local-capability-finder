name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional YAML dependency
        run: python -m pip install PyYAML
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Portable search benchmark
        run: python tests/benchmark_queries.py

  package:
    name: CLI package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional YAML dependency
        run: python -m pip install PyYAML
      - name: Check CLI syntax and entry points
        run: |
          node --check bin/capfind.js
          node bin/capfind.js --help
          node bin/capfind.js --version
      - name: Check npm package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "const p=require('./pack.json')[0]; const f=new Set(p.files.map(x=>x.path)); for (const n of ['bin/capfind.js','capability_finder.py','capability_mcp.py','install_agents.py','library_catalog.py','skill_archive.py','startup_inventory.py','LICENSE','NOTICE']) if (!f.has(n)) throw Error('Missing package file: '+n);"
      - name: Smoke test installed npm package and MCP client
        run: python tests/smoke_package.py
