name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional YAML dependency
        run: python -m pip install PyYAML
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Portable search benchmark
        run: python tests/benchmark_queries.py

  package:
    name: CLI package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install optional YAML dependency
        run: python -m pip install PyYAML
      - name: Check CLI syntax and entry points
        run: |
          node --check bin/capfind.js
          node bin/capfind.js --help
          node bin/capfind.js --version
      - name: Check npm package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "const p=require('./pack.json')[0]; const f=new Set(p.files.map(x=>x.path)); for (const n of ['bin/capfind.js','capability_finder.py','capability_mcp.py','auto_skill_router.py','auto_install.py','auto_hook.py','install_agents.py','library_catalog.py','skill_archive.py','startup_inventory.py','LICENSE','NOTICE']) if (!f.has(n)) throw Error('Missing package file: '+n);"
      - name: Smoke test installed npm package and MCP client
        run: python tests/smoke_package.py
